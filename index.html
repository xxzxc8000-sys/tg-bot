<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoinkBot Downloader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h2 { margin-bottom: 8px; font-size: 20px; color: #38bdf8; }
        p { margin-bottom: 20px; color: #94a3b8; font-size: 13px; line-height: 1.4; }
        
        .input-box {
            width: 100%;
            padding: 14px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            margin-bottom: 16px;
        }
        .input-box:focus { border-color: #38bdf8; }

        .btn-download {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
        .btn-download:active { opacity: 0.85; transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="card">
        <h2>🚀 YoinkBot 無廣告下載</h2>
        <p>貼上 YouTube 或 IG 影片網址，Bot 將直接把影片傳送到聊天室！</p>

        <input type="text" id="videoUrl" class="input-box" placeholder="在此長按貼上網址..." />

        <button class="btn-download" onclick="sendToBot()">
            📥 立即傳送給 Bot 下載
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function sendToBot() {
            const url = document.getElementById('videoUrl').value.trim();
            
            if (!url) {
                alert('請先貼上網址！');
                return;
            }

            // 直接將網址傳回 Bot 後端處理
            tg.sendData(url);
            tg.close();
        }
    </script>
</body>
</html>
